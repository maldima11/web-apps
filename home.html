<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CMS-H is a comprehensive content management 
    system that allows users to create, manage, and modify digital content with ease. 
    It offers a user-friendly interface, customizable templates, and robust features for efficient content organization and publishing.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./styles.css">
    
    <title>EMS Landing Page</title>
</head>
<!-- body -->
<body>
    <main>
    <!-- intro section -->
    <section>
        <!-- <div class="intro"> -->
            <header>
                <img src="./resources/images/EMS.svg" alt="CMS-H Logo" class="logo">
                <nav class="navbar">
                    <a href="#intro">Intro</a>
                    <a href="#about">About</a>
                    <a href="#shop">Shop</a>
                </nav>

                <!-- menu icons -->
                <div class="icons">
                    <div class="fa fa-bars" id="menu-btn"></div>
                        <div class="fa fa-shopping-cart" id="cart-btn">
                            <span class="cart-quantity">0</span>
                        </div>
                </div>
            </header>
        <!-- </div> -->

        <!-- cart items details -->
            <div class="cart-items">
                <div class="grid">
                    <table>
                        <tr>
                            <th>S/N</th>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>AppleWatch</td>
                            <td>$95000</td>
                            <td>
                                <div class="quantity">
                                    <button class="minus">-</button>
                                    <label for="quantity">1</label>
                                    <button class="plus">+</button>
                                </div>
                            </td>
                            <td>
                                <button class="remove">Remove</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>MacBook Air</td>
                            <td>$800000</td>
                            <td>
                                <div class="quantity">
                                    <button class="minus">-</button>
                                    <label for="quantity">1</label>
                                    <button class="plus">+</button>
                                </div>
                            </td>
                            <td>
                                <button class="remove">Remove</button>
                            </td>
                        </tr>
                    </table>

                    <!-- form -->
                    <form>
                        <div class="form-group">
                            <label for="name"></label>
                            <input type="text" id="name" name="name" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="email"></label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone"></label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </div>
                    </form>
                </div>
            </div>

            <!-- <div class="intro-content">
                <h1>Welcome to CMS-H</h1>
                <p>Empowering your content management experience with simplicity and efficiency.</p>
                <a href="#about" class="btn">Learn More</a>
        </div> -->
    </section>


    <!-- the About section -->


    <!-- The Shop section-->

    </main>
    
    <!-- The Footer section -->
    <!-- <footer>
        <p>&copy; 2024 CMS-H. All rights reserved.</p>
    </footer> -->

    <script src="./script.js"></script>
</body>
</html>
